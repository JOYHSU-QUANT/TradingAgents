name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run test suite
        run: pytest -q

  smoke-install:
    name: clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fresh install (no dev extras) and import
        run: |
          python -m pip install --upgrade pip
          pip install .
          # Catches undeclared runtime deps (e.g. #994 python-dotenv): a bare
          # install must import the package and the CLI module.
          python -c "import tradingagents, cli.main; print('clean-install import OK')"

  lint:
    name: ruff (strict, full repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.15"
      - name: Lint the repository
        # The repo is fully clean under the strict select, so we lint everything
        # (generated results/ is excluded via pyproject extend-exclude).
        run: ruff check .

  typecheck:
    name: mypy (pyproject [tool.mypy] files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mypy
        # Only mypy: what the checked files import beyond the standard library
        # is listed as overrides in pyproject [tool.mypy], each read as ``Any``
        # here. Pinned exactly because ``warn_unused_ignores`` turns a newer
        # mypy's better narrowing into a red job; bump it on purpose, with the
        # pins.
        run: pip install "mypy==2.3.1"
      - name: Type-check the files pyproject [tool.mypy] lists
        run: mypy

  autoresearch:
    name: autoresearch + replay + carry + dashboard tests (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (dev extras, then the perp module's requirements)
        # contrib/autoresearch borrows read-only from contrib/hyperliquid_perp,
        # and its pin tests import the venue reader, which needs the Hyperliquid
        # SDK that requirements.txt declares and pyproject does not.
        # contrib/replay and contrib/carry borrow from both packages and share
        # this install. contrib/core (the shared floor) and contrib/tests (the
        # graph between the packages) need nothing beyond the dev install and
        # ride along: this is the job that already runs every borrower.
        # requirements.txt also lists ".", which would rebuild and replace the
        # editable install just made; that line is filtered out.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          grep -v '^\.$' requirements.txt | pip install -r /dev/stdin
      - name: Install the dashboard page's requirements (and httpx for its test client)
        # contrib/dashboard/app (the read-only page, dashboard plan PR 4) pins
        # FastAPI, uvicorn and Jinja in its own file; the trader's venv never
        # installs them, this job does, and the test step below says so.
        # --require-hashes, as the host's installer passes it (the header of
        # requirements.txt says why): a pin whose wheel is not among the
        # listed hashes fails here, on the same command. --force-reinstall:
        # pip hashes what it downloads, and a pin this job's venv already
        # holds at that version (pydantic, anyio, click... from the installs
        # above) would be skipped unverified; the other version is uninstalled
        # first (--ignore-installed would leave its dist-info beside the new
        # one, and pip check could read either). httpx is the test client's, not
        # the page's, so it goes first and apart (pip refuses a bare
        # requirement on a hash-checked command line); the pins come last so
        # whatever httpx moved is put back, and pip check then reports the
        # conflict instead of the tests passing against versions the host
        # never runs. pip check also catches a pin that a floor elsewhere in
        # the job's shared venv forbids.
        run: |
          pip install "httpx>=0.27"
          pip install --require-hashes --force-reinstall -r contrib/dashboard/requirements.txt
          pip check
      - name: Run the research radar's, the replay, carry, dashboard and core packages' suites and the package graph
        # DASHBOARD_WEB_TESTS=required: contrib/dashboard/tests/test_web.py
        # skips where the page's requirements are not installed (the trader's
        # venv); here a missing install fails the job instead of skipping.
        env:
          DASHBOARD_WEB_TESTS: required
        run: pytest -q contrib/autoresearch/tests contrib/replay/tests contrib/carry/tests contrib/dashboard/tests contrib/core/tests contrib/tests

  uniswap-v3:
    name: uniswap_v3 tests (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (dev extras, then the package's own requirements)
        # contrib/uniswap_v3 imports no other contrib package, so it needs
        # none of the perp module's requirements. What it does need beyond
        # the dev install, PyYAML for its config loader and web3 for its
        # chain reader, is listed in its own requirements file. The suite
        # replays recorded JSON-RPC responses; the smoke tests, which need a
        # real node, are left out.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -r contrib/uniswap_v3/requirements.txt
      - name: Run the Uniswap v3 package's suite
        run: pytest -q -m "not smoke" contrib/uniswap_v3/tests
