name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job but ``test-latest`` installs at versions a commit chose (issue
# #442), so a release an index publishes changes nothing here until a commit
# moves a pin. For all but three install lines that is -c with a constraints
# file of .github/constraints (its README says how the files are written and
# moved). The three: pip's own upgrade, which nothing pins; mypy, pinned on
# its line at another version than the files hold; the dashboard's pins,
# each by hash. -c and not the PIP_CONSTRAINT variable, which would bind
# those pins too. tests/test_ci_constraints.py reads this file and fails on
# an install line added without -c that is not one of the three.
jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c .github/constraints/py${{ matrix.python-version }}.txt
      - name: Run test suite
        run: pytest -q

  test-latest:
    # The one job that installs what the index offers today, as every job did
    # before #442, and is not a required check on purpose: red here says a
    # release moved something the suite reads and blocks no merge. What to do
    # then is in .github/constraints/README.md. The two ends of the matrix
    # above: a release reaches the newest Python first and the oldest last
    # (or never), and the ends are where the two differ.
    name: tests, latest deps (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extras, newest releases)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run test suite
        run: pytest -q
      - name: List what was installed at another version than the constraints file pins
        # Whatever the suite did: the list is read when the suite is red.
        # After it, so that a fault in the report cannot keep it from running.
        if: always()
        run: python .github/constraints/drift.py .github/constraints/py${{ matrix.python-version }}.txt

  smoke-install:
    name: clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fresh install (no dev extras) and import
        run: |
          python -m pip install --upgrade pip
          pip install . -c .github/constraints/py3.12.txt
          # Catches undeclared runtime deps (e.g. #994 python-dotenv): a bare
          # install must import the package and the CLI module. The
          # constraints file names versions and installs nothing, so a
          # dependency the project does not declare is still missing here.
          python -c "import tradingagents, cli.main; print('clean-install import OK')"

  lint:
    name: ruff (strict, full repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        # At the version the constraints file pins: under the strict select a
        # newer ruff's new rule is a red job on a commit that changed nothing.
        run: pip install ruff -c .github/constraints/py3.12.txt
      - name: Lint the repository
        # The repo is fully clean under the strict select, so we lint everything
        # (generated results/ is excluded via pyproject extend-exclude).
        run: ruff check .

  typecheck:
    name: mypy (pyproject [tool.mypy] files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mypy
        # Only mypy: what the checked files import beyond the standard library
        # is listed as overrides in pyproject [tool.mypy], each read as ``Any``
        # here. Pinned exactly because ``warn_unused_ignores`` turns a newer
        # mypy's better narrowing into a red job; bump it on purpose, with the
        # pins.
        run: pip install "mypy==2.3.1"
      - name: Type-check the files pyproject [tool.mypy] lists
        run: mypy

  autoresearch:
    name: autoresearch + replay + carry + dashboard tests (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (dev extras, then the perp module's requirements)
        # contrib/autoresearch borrows read-only from contrib/hyperliquid_perp,
        # and its pin tests import the venue reader, which needs the Hyperliquid
        # SDK that requirements.txt declares and pyproject does not.
        # contrib/replay and contrib/carry borrow from both packages and share
        # this install. contrib/core (the shared floor) and contrib/tests (the
        # graph between the packages) need nothing beyond the dev install and
        # ride along: this is the job that already runs every borrower but one.
        # contrib/discovery borrows from autoresearch and core too, but its
        # suite runs in the job below: its tool server needs the MCP SDK, and
        # the SDK's own requirements do not sit in one venv with the
        # dashboard's pins this job installs next.
        # requirements.txt also lists ".", which would rebuild and replace the
        # editable install just made; that line is filtered out.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c .github/constraints/py3.12.txt
          grep -v '^\.$' requirements.txt | pip install -r /dev/stdin -c .github/constraints/py3.12.txt
      - name: Install the dashboard page's requirements (and httpx for its test client)
        # contrib/dashboard/app (the read-only page, dashboard plan PR 4) pins
        # FastAPI, uvicorn and Jinja in its own file; the trader's venv never
        # installs them, this job does, and the test step below says so.
        # --require-hashes, as the host's installer passes it (the header of
        # requirements.txt says why): a pin whose wheel is not among the
        # listed hashes fails here, on the same command. --force-reinstall:
        # pip hashes what it downloads, and a pin this job's venv already
        # holds at that version (pydantic, anyio, click... from the installs
        # above) would be skipped unverified; the other version is uninstalled
        # first (--ignore-installed would leave its dist-info beside the new
        # one, and pip check could read either). httpx is the test client's, not
        # the page's, so it goes first and apart (pip refuses a bare
        # requirement on a hash-checked command line); the pins come last so
        # whatever httpx moved is put back, and pip check then reports the
        # conflict instead of the tests passing against versions the host
        # never runs. pip check also catches a pin that a floor elsewhere in
        # the job's shared venv forbids. The pins take no constraints file:
        # they are every version this line installs already, by hash.
        run: |
          pip install "httpx>=0.27" -c .github/constraints/py3.12.txt
          pip install --require-hashes --force-reinstall -r contrib/dashboard/requirements.txt
          pip check
      - name: Run the research radar's, the replay, carry, dashboard and core packages' suites and the package graph
        # DASHBOARD_WEB_TESTS=required: contrib/dashboard/tests/test_web.py
        # skips where the page's requirements are not installed (the trader's
        # venv); here a missing install fails the job instead of skipping.
        env:
          DASHBOARD_WEB_TESTS: required
        run: pytest -q contrib/autoresearch/tests contrib/replay/tests contrib/carry/tests contrib/dashboard/tests contrib/core/tests contrib/tests

  discovery:
    name: discovery tests (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (dev extras and the tool server's SDK)
        # contrib/discovery borrows from contrib/autoresearch and contrib/core
        # and needs nothing of the perp module's requirements (its suite was
        # run with the Hyperliquid SDK and PyYAML unimportable, 2026-11-16).
        # What it does need beyond the dev install is the MCP SDK its tool
        # server is built on (tools plan T2), declared as the optional
        # ``discovery-tools`` install. A job of its own because that SDK
        # requires sse-starlette, whose current release requires a newer
        # starlette than contrib/dashboard/requirements.txt pins: in the job
        # above, either pip check is red or the dashboard's suite runs on a
        # starlette its host never installs. The SDK is installed, never
        # skipped around: the suite imports it at the top of its test
        # module, so a missing install fails collection here.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,discovery-tools]" -c .github/constraints/py3.12.txt
          pip check
      - name: Run the discovery package's suite
        # Includes the tool server started as a real stdio child, which is
        # the one place this suite's behaviour depends on the platform.
        run: pytest -q contrib/discovery/tests

  uniswap-v3:
    name: uniswap_v3 tests (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (dev extras, then the package's own requirements)
        # contrib/uniswap_v3 imports no other contrib package, so it needs
        # none of the perp module's requirements. What it does need beyond
        # the dev install, PyYAML for its config loader and web3 for its
        # chain reader, is listed in its own requirements file. The suite
        # replays recorded JSON-RPC responses; the smoke tests, which need a
        # real node, are left out.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -r contrib/uniswap_v3/requirements.txt -c .github/constraints/py3.12.txt
      - name: Run the Uniswap v3 package's suite
        run: pytest -q -m "not smoke" contrib/uniswap_v3/tests
