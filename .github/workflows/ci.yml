name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run test suite
        run: pytest -q

  smoke-install:
    name: clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fresh install (no dev extras) and import
        run: |
          python -m pip install --upgrade pip
          pip install .
          # Catches undeclared runtime deps (e.g. #994 python-dotenv): a bare
          # install must import the package and the CLI module.
          python -c "import tradingagents, cli.main; print('clean-install import OK')"

  lint:
    name: ruff (strict, full repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.15"
      - name: Lint the repository
        # The repo is fully clean under the strict select, so we lint everything
        # (generated results/ is excluded via pyproject extend-exclude).
        run: ruff check .

  typecheck:
    name: mypy (perp lower layers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mypy
        # Only mypy: the layers pyproject [tool.mypy] checks import stdlib
        # plus pandas/stockstats, which its override lets mypy miss.
        run: pip install "mypy>=2.0"
      - name: Type-check the perp module's lower layers
        run: mypy

  autoresearch:
    name: autoresearch tests (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (dev extras, then the perp module's requirements)
        # contrib/autoresearch borrows read-only from contrib/hyperliquid_perp,
        # and its pin tests import the venue reader, which needs the Hyperliquid
        # SDK that requirements.txt declares and pyproject does not.
        # requirements.txt also lists ".", which would rebuild and replace the
        # editable install just made; that line is filtered out.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          grep -v '^\.$' requirements.txt | pip install -r /dev/stdin
      - name: Run the research radar's suite
        run: pytest -q contrib/autoresearch/tests
