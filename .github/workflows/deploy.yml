name: Deploy paper trader

on:
  push:
    branches: [deploy/paper]

concurrency: deploy-paper

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SSH_HOST }}
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new ubuntu@"$HOST" 'bash -s' <<'EOF'
          set -e
          sudo -u trader bash -c '
            set -e
            cd ~/TradingAgents
            git fetch origin deploy/paper
            git checkout deploy/paper 2>/dev/null || git checkout -b deploy/paper origin/deploy/paper
            git reset --hard origin/deploy/paper
            .venv/bin/pip install -q -r requirements.txt
            .venv/bin/python -m pytest contrib/core/tests/ contrib/hyperliquid_perp/tests/ contrib/carry/tests/ contrib/dashboard/tests/ contrib/tests/ -q
          '
          # The carry sleeve's perp daemon and coordinator run from this same
          # checkout (contrib/carry/RUNBOOK.md): the daemon is restarted with
          # hl-paper while its unit is enabled (one the operator disabled stays
          # down); the coordinator's timer runs the checkout as it is.
          # The status exporter (contrib/dashboard/RUNBOOK.md) is held for the
          # restart, so a tick does not mail the daemon down and up again.
          if systemctl is-enabled --quiet dashboard-exporter.timer 2>/dev/null; then
            sudo systemctl stop dashboard-exporter.timer
            # A tick already running finishes first (a few seconds).
            while systemctl is-active --quiet dashboard-exporter.service; do sleep 1; done
            # Back whatever happens below (set -e): a daemon that fails to come
            # up is news the exporter must send.
            trap 'sudo systemctl start dashboard-exporter.timer' EXIT
          fi
          sudo systemctl restart hl-paper
          if systemctl is-enabled --quiet hl-paper-carry-eth 2>/dev/null; then
            sudo systemctl restart hl-paper-carry-eth
          fi
          sleep 15
          sudo systemctl is-active hl-paper
          if systemctl is-enabled --quiet hl-paper-carry-eth 2>/dev/null; then
            sudo systemctl is-active hl-paper-carry-eth
          fi
          # The daemons are back: the exporter's timer watches them again now,
          # not only when this script exits (the trap stays as the failure path).
          if systemctl is-enabled --quiet dashboard-exporter.timer 2>/dev/null; then
            sudo systemctl start dashboard-exporter.timer
          fi
          # The read-only page (contrib/dashboard/RUNBOOK.md section 7) runs
          # from its own copy of the package; when it is installed, the
          # installer takes the new commit (and restores the previous tree and
          # unit file if any step after the stop fails). A page that fails to upgrade is a
          # warning on the run, not a failed deploy of the daemons — except a
          # wheel pip refused because its hash is not in requirements.txt
          # (--require-hashes): the daemons are deployed by now, so the run
          # goes red for that one, and RUNBOOK section 7.6 says what to check.
          if systemctl is-enabled --quiet dashboard-web.service 2>/dev/null; then
            # Captured, not piped: this shell has no pipefail, and a pipe
            # would report tee's status, not the installer's.
            if out=$(sudo bash /home/trader/TradingAgents/contrib/dashboard/schedule/install-web.sh 2>&1); then
              printf '%s\n' "$out"
            else
              printf '%s\n' "$out"
              if grep -q "DO NOT MATCH THE HASHES" <<<"$out"; then
                echo "::error::dashboard-web: pip refused a wheel whose hash is not in requirements.txt ($(systemctl is-active dashboard-web.service)); do not regenerate the hashes before reading RUNBOOK section 7.6"
                exit 1
              fi
              echo "::warning::dashboard-web: install-web.sh failed ($(systemctl is-active dashboard-web.service)); check systemctl status dashboard-web on the host"
            fi
          fi
          EOF
