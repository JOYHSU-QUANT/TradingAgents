name: Secrets

# Every branch, not just main/develop like ci.yml: a key pushed to
# deploy/paper or to a branch with no PR is public the moment it lands, so the
# scan has to run on that push. It does not gate deploy.yml -- blocking a
# deploy cannot un-publish a key, it would only stall the paper trader.
# The job name is a required status check on develop and main; renaming it
# silently drops that requirement, so change the branch protection with it.
on:
  push:
    branches: ["**"]
  pull_request:

# Only a PR run gives way to a newer one. A push run always finishes: a commit
# pushed and then force-pushed away is public for that moment, and the newer
# run would no longer reach it.
concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks (every commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, not the merge commit alone: a key committed in
          # one commit and deleted in the next is still published.
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        # The release binary straight from GitHub, checked against the hash
        # its checksums.txt lists, rather than a third-party action. Bump the
        # version and the hash together.
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Self-test the rules
        run: python3 .github/gitleaks_selftest.py "$RUNNER_TEMP/gitleaks"
      - name: Scan
        # .gitleaks.toml and .gitleaksignore at the repo root are picked up
        # by default. --redact keeps a found value out of the public log.
        # With no --log-opts gitleaks walks every ref the checkout fetched
        # (all branches and tags), on purpose: anything pushed to GitHub is
        # public, so a key on a stale branch should fail this job too.
        # Merge commits show no diff in `git log -p`, so a key introduced only
        # while resolving a merge is not seen. `-m` would close that, but it
        # re-diffs every merge (the upstream sync 839b4d9 among them) against
        # each parent, so the pinned false positives come back under the
        # merges' SHAs (checked 2026-10-12: 4 new findings).
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose'
