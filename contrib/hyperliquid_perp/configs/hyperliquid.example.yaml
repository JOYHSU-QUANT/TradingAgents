# Hyperliquid perp — example config. Copy to hyperliquid.local.yaml and fill in.
# The .local.yaml is gitignored; it holds the PUBLIC wallet address + network
# only. Secrets (OPENROUTER_API_KEY, the Phase-3 agent-wallet key) live in env
# vars, never here (phase1-spec decision #9).

network: mainnet              # Phase 1/2 = mainnet (read-only); testnet reserved for Phase 3 order testing
network_timeout_s: 30         # HTTP timeout (seconds) per Hyperliquid request; a stalled read fails instead of hanging forever
wallet_address: "0xYOUR..."   # read-only mainnet address; only needed for account/position reads, NOT for --context-only
coins: [BTC]                  # single coin for Phase 1; add more later

market_data:
  candle_interval: "4h"
  candle_lookback: 200             # candles for indicator warm-up
  funding_zscore_window_days: 30

indicators: [rsi_14, ema_20, ema_50, atr_14, macd]   # computed by context_builder

engine:
  llm_provider: openrouter
  deep_think_llm: "anthropic/claude-sonnet-4-6"
  quick_think_llm: "deepseek/deepseek-chat"
  selected_analysts: [market, social, news]

# Phase 2 structured target contract (phase2-spec.md §2). The Phase 1 rating
# adapter block is retired — the engine now outputs the structured JSON target
# directly and the deterministic RiskGate below sizes/checks it.
risk:
  leverage: 1                  # Phase 2 first version is 1x (spec §2.1)
  margin_mode: cross           # Phase 2 is cross-only (spec §2.2)
  max_target_margin_pct: 60    # RiskGate clamp ceiling; requested 61-100 -> approved 60 (spec §2.3)

decision:
  ai_target_margin_min_pct: 0    # legal requested_target_margin_pct grid: {min, min+step, ..., max}
  ai_target_margin_max_pct: 100
  target_margin_step_pct: 1      # integer percent steps; off-grid values fail closed (no rounding)
  rebalance_deadband_pct: 10     # same-side |approved - current| < this -> no order (flip/flat exempt); paper-tuned from the spec default 1 (2026-07 baseline: small resizes churned fees)
  min_confidence: 0.3            # set_target below this is risk-REJECTED (flat included); confidence never scales sizing
  resize_min_confidence: 0.7     # same-side resize below this is risk-REJECTED (churn control); open/flip/flat use min_confidence; must be >= min_confidence (setting it equal disables the extra bar)

# Phase 2 paper-trading engine defaults (phase2-execution.md §5.4). initial
# balance / positions apply only when a NEW run_id is created; a restart recovers
# from the recorded SQLite accounting events, never resets to these.
paper_trading:
  account:
    initial_balance_usdc: 1000   # opening paper wallet balance
    initial_positions: []        # seed positions: [{coin: BTC, size: 0.01, entry_price: 60000}]
  execution:
    taker_fee_rate: 0.00045      # 0.045% taker fee on every simulated fill (§6.5)
    min_notional_usdc: 10        # min per-order notional for TWAP slicing (PR 3, §1.2)
    market_monitor:
      interval_seconds: 30       # 30s poll cadence for the position-aware monitor (PR 3, §5.5)
      request_timeout_seconds: 5 # per-request market-data timeout (§1.1)
    fill_model:
      slippage_bps: 5            # simulated slippage applied to mid on every fill (§5.2)
