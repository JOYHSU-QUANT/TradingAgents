# Hyperliquid perp — example config. Copy to hyperliquid.local.yaml and fill in.
# The .local.yaml is gitignored; it holds the PUBLIC wallet address, network,
# and the Phase 3 live: gate block — non-secret settings only. Secrets
# (OPENROUTER_API_KEY, the Phase-3 agent-wallet key) live in env vars, never
# here (phase1-spec decision #9).

network: mainnet              # Phase 1/2 = mainnet (read-only); testnet reserved for Phase 3 order testing
network_timeout_s: 30         # HTTP timeout (seconds) per Hyperliquid request; a stalled read fails instead of hanging forever
wallet_address: "0xYOUR..."   # read-only mainnet address; only needed for account/position reads, NOT for --context-only
coins: [BTC]                  # single coin for Phase 1; add more later

market_data:
  candle_interval: "4h"
  candle_lookback: 200             # candles for indicator warm-up
  funding_zscore_window_days: 30

indicators: [rsi_14, ema_20, ema_50, atr_14, macd]   # computed by context_builder

engine:
  llm_provider: openrouter
  deep_think_llm: "anthropic/claude-sonnet-4-6"
  quick_think_llm: "deepseek/deepseek-chat"
  selected_analysts: [market, social, news]
  # Deep-think structured output is OFF by default for perp runs — the Phase 2
  # target JSON must survive in final_trade_decision free text; a schema render
  # drops it and every cycle fail-closes as invalid_output (RUNBOOK §7). Only
  # set true once the contract is carried by the structured schema itself.
  # The value must be a bare YAML bool (true/false, no quotes) — a quoted
  # "false" is not a bool and is rejected at config load.
  # structured_output: false

# Phase 2 structured target contract (phase2-spec.md §2). The Phase 1 rating
# adapter block is retired — the engine now outputs the structured JSON target
# directly and the deterministic RiskGate below sizes/checks it.
risk:
  leverage: 1                  # Phase 2 first version is 1x (spec §2.1)
  margin_mode: cross           # Phase 2 is cross-only (spec §2.2)
  max_target_margin_pct: 60    # RiskGate clamp ceiling; requested 61-100 -> approved 60 (spec §2.3)

decision:
  ai_target_margin_min_pct: 0    # legal requested_target_margin_pct grid: {min, min+step, ..., max}
  ai_target_margin_max_pct: 100
  target_margin_step_pct: 1      # integer percent steps; off-grid values fail closed (no rounding)
  rebalance_deadband_pct: 10     # same-side |approved - current| < this -> no order (flip/flat exempt); paper-tuned from the spec default 1 (2026-07 baseline: small resizes churned fees)
  min_confidence: 0.3            # set_target below this is risk-REJECTED (flat included); confidence never scales sizing
  resize_min_confidence: 0.7     # same-side resize below this is risk-REJECTED (churn control); open/flip/flat use min_confidence; must be >= min_confidence (setting it equal disables the extra bar)

# Phase 2 paper-trading engine defaults (phase2-execution.md §5.4). initial
# balance / positions apply only when a NEW run_id is created; a restart recovers
# from the recorded SQLite accounting events, never resets to these.
paper_trading:
  account:
    initial_balance_usdc: 1000   # opening paper wallet balance
    initial_positions: []        # seed positions: [{coin: BTC, size: 0.01, entry_price: 60000}]
  execution:
    taker_fee_rate: 0.00045      # 0.045% taker fee on every simulated fill (§6.5)
    min_notional_usdc: 10        # min per-order notional for TWAP slicing (PR 3, §1.2)
    market_monitor:
      interval_seconds: 30       # 30s poll cadence for the position-aware monitor (PR 3, §5.5)
      request_timeout_seconds: 5 # per-request market-data timeout (§1.1)
    fill_model:
      slippage_bps: 5            # simulated slippage applied to mid on every fill (§5.2)

# Phase 3 live execution gates (phase3-spec §4) — uncomment to use the `live`
# subcommand. The agent private key is NEVER put here: it is read from
# HYPERLIQUID_AGENT_KEY_TESTNET / _MAINNET per live.network (§6). Real orders
# additionally require allow_real_orders: true AND every §4.1 gate to pass.
# Notes (§24): a present live: block is deep-validated on EVERY config load —
# including "risk: must be written explicitly" (the block AND its three
# cross-checked fields: leverage, margin_mode, max_target_margin_pct) and the
# risk↔live consistency cross-check — so a broken staged combination also
# stops paper; live inherits the top-level network_timeout_s and
# wallet_address (only network: is live-local).
# live:
#   mode: testnet_live           # REQUIRED: paper / testnet_live / mainnet_tiny (mainnet_live is rejected in v1)
#   network: testnet             # REQUIRED; pinned per mode: testnet_live->testnet, mainnet_tiny->mainnet
#   allow_real_orders: false     # master gate; true requires require_agent_wallet: true (§6 rule 7) and the agent key env var (§6 rule 6)
#   allow_manage_external_orders: false   # must stay false in v1 (§25: bot-owned orders only)
#   order_owner_prefix: "hta"    # readable cloid_logical prefix only, NOT used for bot-owned detection
#   require_agent_wallet: true   # true -> startup fails without the agent key env var; must be true when allow_real_orders is true
#   safety:
#     single_symbol_only: true   # must stay true in v1 (§25 #4: single symbol only)
#     allowed_symbols: [BTC]      # case-sensitive — write it as the exchange lists it (e.g. kPEPE)
#     leverage: 1                # Phase 3 v1 is 1x only (§25)
#     margin_mode: cross
#     max_target_margin_pct: 60  # mainnet_tiny hard-caps this at 60 (§21.1)
#     max_notional_usdc: 100     # >= 10 (exchange min order); mainnet_tiny hard-caps at 100 (§21.1)
#     absolute_notional_ceiling: 500   # config-load ceiling for max_notional_usdc (§5 rule 5; fail, not clamp)
#     max_open_orders: 5               # behaviour §10.5
#     max_daily_loss_pct: 2            # behaviour §10.3
#     max_consecutive_loss_count: 3    # behaviour §10.4
#   execution:
#     default_style: sliced_twap       # entry/rebalance only (§9.4); the only v1 style
#     max_slippage_pct: 0.005          # a FRACTION: 0.005 = ±0.5% IOC limit band (§9.2)
#     plan_duration_minutes: 60        # an ENVELOPE, not a slice-count commitment: the min clip
#     slice_interval_seconds: 30       # size (exchange 10 USDC min) wins over interval (§9.1)
#   websocket:
#     disconnect_safe_mode_after_seconds: 300
#   protection:
#     sl_repair_max_attempts: 3
#     sl_repair_retry_delay_seconds: 5
#     tp_failure_mode: degraded_protection
#   kill_switch:
#     enabled: true                    # required true whenever allow_real_orders is true (§4.1)
#     schedule_cancel_seconds: 120     # must be > 5 (Hyperliquid's own floor)
#     refresh_interval_seconds: 30     # schedule_cancel must be >= 2x this: the loop
#                                      # refreshes only on a tick, so one missed cycle
#                                      # must not let the switch fire (§18.1)
#     on_refresh_failed: safe_mode
#     on_shutdown: cancel_bot_owned_open_orders
#     emergency_close_on_shutdown: false
#                                      # `true` is REJECTED at config load: shutdown-time
#                                      # emergency close is unimplemented (deferred to PR 6;
#                                      # shutdown keeps resting SL/TP, §18.2 rule 8) — an
#                                      # unimplemented behaviour must not be silently accepted.
#                                      # Also checked when the switch arms: the host clock vs
#                                      # the exchange's. scheduleCancel deadlines are ABSOLUTE
#                                      # and computed from the local clock, so >= 5s of drift
#                                      # is refused — it would silently resize the real
#                                      # protection window (fix NTP first). See §18.1.
