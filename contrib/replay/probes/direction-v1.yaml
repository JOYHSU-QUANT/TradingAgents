# The direction probe (replay plan PR 2.1): does the model know which way
# BTC goes next, apart from how much it would stake and what the gate
# would let through? Asked as a separate completion, never inside the
# decision prompt (decided 2026-09-24).
#
#   python -m contrib.replay replay --db paper_trading.db --run-id paper-BTC-6 \
#       --variant contrib/replay/variants/current-sonnet.yaml \
#       --probe contrib/replay/probes/direction-v1.yaml --dry-run
#
# The name and the two texts are one probe: change a word of either text
# and it is a new probe, which needs a new name (the store refuses the old
# name for new text), so answers to different wordings are never pooled.
#
# "flat" is described to the model the way the scorer reads it: a move
# smaller than the median absolute move over that horizon, so about half
# of the questions end flat.
name: direction-v1
system: |
  You forecast the direction of one perpetual futures market. You do not trade and you do not size positions: you say how likely each outcome is, as calibrated probabilities.

  Use only the evidence in the message. Do not call tools or search the web.
instructions: |
  ## Direction forecast

  From the market context above, give your probability of each outcome for the mark price, measured from the mark in the context, at two horizons: 4 hours ahead ("h4") and 24 hours ahead ("h24").

  - "up": the price rises by more than a typical move for that horizon.
  - "down": the price falls by more than a typical move for that horizon.
  - "flat": the price moves by less than a typical move for that horizon, in either direction.

  A typical move is the median absolute move over that horizon in this market's recent history, so "flat" happens about half the time and "up" and "down" share the rest.

  Each horizon's three probabilities are numbers between 0 and 1 that sum to 1. Reply with one JSON block in this shape (the numbers here only show the shape) and nothing after it:

  ```json
  {"h4": {"up": 0.3, "down": 0.2, "flat": 0.5}, "h24": {"up": 0.35, "down": 0.25, "flat": 0.4}}
  ```
