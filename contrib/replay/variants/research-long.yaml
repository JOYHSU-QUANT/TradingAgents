# Experiment B of the discovery plan (section 4.7), arm 3 of 4: the research
# section, saying LONG. Does the research signal reach the decision at all?
# The four research-* variants are one variant in everything but
# ``extra_context`` (none / a neutral text of the same length / long /
# short), put to the same recorded questions and compared with `effect`.
#
# The questions: paper-BTC-3, -4 and -5, the finished runs whose recorded
# context_shape has no ``autoresearch`` (103 train and validation questions
# between them, 2026-08-28 to 2026-09-18). Runs 6 to 11 carry the section on
# every question, and a second section beside the recorded one would be a
# different experiment; the runs before 3 recorded no shape and had no
# position block; run 12, opened 2026-11-10 with the section switched off,
# was a day old when this was written.
#
#   python -m contrib.replay replay --db paper_trading.db --run-id paper-BTC-3 \
#       --variant contrib/replay/variants/research-long.yaml --dry-run
# The conclusion is read off ONE comparison, named before any answer was
# bought (2026-11-11): this arm against research-short, two texts one word
# apart, so whatever the neutral text does cancels. Each against
# research-neutral can be printed too (two --variant flags, --against
# research-neutral) and decides nothing.
#
#   python -m contrib.replay effect --db paper_trading.db --replay-db replay.sqlite \
#       --run-id paper-BTC-3 --run-id paper-BTC-4 --run-id paper-BTC-5 \
#       --variant research-long --against research-short
name: research-long
# The paper trader's portfolio manager since run 8 (2026-10-07), asked the
# simple way: one completion, the instructions `current-sonnet` uses.
model:
  provider: openrouter
  id: anthropic/claude-sonnet-5.5
system_prompt_path: current_system.md
# No temperature, as the daemon sets none: the same provider default on all
# four arms. The cap is the perp default since 2026-10-07.
max_tokens: 16384
# Claude Sonnet 5.5's published training data cutoff, June 2026, taken as
# the last day of the month. `effect` scores no later price and does not
# read it; `score --replay-db` does.
model_cutoff: 2026-06-30
# The section as `prompt_context._research_signal_lines` rendered it for
# paper-BTC-7 (rule, bands, windows, note and basis word for word), with two
# changes: the side is this arm's, and the dateline names the context's own
# close (the ``As of:`` line at its top) where the daemon printed the radar's
# timestamp. A fixed timestamp in a file put to three weeks of questions would
# read as a stale signal on all but one of them. It lands after the position
# block, not before it where the daemon renders it: ``extra_context`` follows
# the whole recorded context, and the format block follows it.
extra_context: |-
  Research signal (rule btc-4h-maker#9, decided on the research radar's own 4h bars, as of the close this context is as of):
    Side the rule holds after its latest bar: long
    Confidence band, cut from its return-to-volatility ratio over the window it was selected on: medium
    Drawdown band, cut from its deepest peak-to-trough fall over that same window: shallow
    Window the two bands were cut from: 159 days. A further 159 days were held back from the search and measured once, which is what the note below reports
    Notes: held-back window, measured once: net return positive, return-to-volatility below the selection window's; nothing since has been measured
    Basis: a fixed rule the research radar fitted and scored offline on its own copy of this coin's history — not on the candles above, and not on this account's fills. That rule decides at a bar's close and is priced as filling at the next bar's open, so the side above is the one it carries into its next bar rather than a trade taken at the close named above. The two bands are ordinal labels over that rule's own measurements; the figures behind them are deliberately not printed. Nothing in this section feeds the risk checks, the sizing or any order — it is one more input to weigh.
