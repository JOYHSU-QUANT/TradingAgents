# Experiment B of the discovery plan (section 4.7), arm 1 of 4: no extra
# context. The questions as they were recorded, on the model and prompt the
# other three research-* variants use; research-long.yaml says why each
# line is what it is.
#
# Asked FIRST, with research-neutral (decided 2026-11-11): research-neutral
# against this arm reads what ANY added section does, and the long and short
# arms are bought only once `effect` says of it "no measurable effect". A
# neutral text that moves the decision on its own is rewritten, and asked
# again, before the other two are.
#
#   python -m contrib.replay replay --db paper_trading.db --run-id paper-BTC-3 \
#       --variant contrib/replay/variants/research-none.yaml --dry-run
name: research-none
model:
  provider: openrouter
  id: anthropic/claude-sonnet-5.5
system_prompt_path: current_system.md
max_tokens: 16384
model_cutoff: 2026-06-30
