# Example configuration for contrib/uniswap_v3. Copy it to a *.local.yaml
# beside this file (gitignored) and edit the copy.
#
# Tokens and pools are named by their keys in contrib/uniswap_v3/constants.py;
# a config cannot supply an address. Unknown keys are refused.

chain_id: 1                 # Ethereum mainnet
quote_token: USDC           # prices and portfolio value are in this token
tokens: [USDC, WETH, WBTC]
pools:                      # <token0>/<token1>-<fee>, fee in hundredths of a basis point
  - USDC/WETH-500
  - WBTC/WETH-500

# Bars. A boundary is a multiple of interval_seconds since the epoch, so a
# one-day bar closes at 00:00 UTC; interval_seconds must divide a day
# (86400). A bar whose close price is further than
# max_twap_deviation from the TWAP over twap_window_seconds is suspect and
# is not traded on; a move of more than max_move since the bar before is
# reported. These are the defaults, and the whole section may be left out.
bars:
  interval_seconds: 86400
  twap_window_seconds: 1800
  max_twap_deviation: "0.02"
  max_move: "0.5"

# Execution. A rebalance leaves out a transfer worth less than min_trade_value
# (in the quote token). max_slippage is how far below the bar's close price,
# after the pools' fees, a swap's output may fall before the swap is refused.
# A modelled or quoted fill is taken delay_blocks after the first block of the
# bar's boundary. model is the offline fill model's own: what it takes off the
# close price on top of the fees, and the gas it charges per pool crossed, at
# the bar's base fee. quote is the quoted fill's own: the gas it adds, once
# per swap, to the quoter's estimate, which covers the pools' swaps alone.
# These are the defaults, and the whole section may be left out.
execution:
  min_trade_value: "10"
  max_slippage: "0.005"
  delay_blocks: 25
  model:
    slippage: "0.0005"
    gas_units_per_hop: 150000
  quote:
    gas_overhead_units: 50000

# A fork run signs as one of anvil's ten public dev accounts (0-9) and gives each
# swap deadline_seconds after the fork's clock to be mined. Left out, a fork run
# signs as account 0 with a 300-second deadline. Adding the section changes the
# config's snapshot, so a run started without it cannot be carried on with it:
# add it to a config of its own for fork runs, not to the one a paper run uses.
# fork:
#   account: 0
#   deadline_seconds: 300

# The name of the environment variable that holds the node's URL, never the
# URL itself. Backfilling and quoted backtests need an archive node, and so
# does a paper run that has to catch up on bars whose visits were missed.
rpc:
  url_env: ETH_RPC_URL

# fixed_weights is a placeholder that drives the engine: hold these shares of
# portfolio value, and rebalance when one is more than `band` (absolute
# weight) away from its target. Numbers are quoted so no float digits are lost.
strategy:
  name: fixed_weights
  params:
    weights:
      USDC: "0.5"
      WETH: "0.3"
      WBTC: "0.2"
    band: "0.05"

# trend_vol_weights is a rule strategy: hold a token while its close is above
# its moving average, sized to a volatility target. Every param is required;
# the rule and the params are defined in strategies/trend_vol_weights.py.
#
# strategy:
#   name: trend_vol_weights
#   params:
#     trend_window: 50
#     vol_window: 20
#     bars_per_year: 365
#     target_vol: "0.40"
#     max_weight: "0.5"
#     band: "0.05"
