# Example configuration for contrib/uniswap_v3. Copy it to a *.local.yaml
# beside this file (gitignored) and edit the copy.
#
# Tokens and pools are named by their keys in contrib/uniswap_v3/constants.py;
# a config cannot supply an address. Unknown keys are refused.

chain_id: 1                 # Ethereum mainnet
quote_token: USDC           # prices and portfolio value are in this token
tokens: [USDC, WETH, WBTC]
pools:                      # <token0>/<token1>-<fee>, fee in hundredths of a basis point
  - USDC/WETH-500
  - WBTC/WETH-500

# Bars. A boundary is a multiple of interval_seconds since the epoch, so a
# one-day bar closes at 00:00 UTC; interval_seconds must divide a day
# (86400). A bar whose close price is further than
# max_twap_deviation from the TWAP over twap_window_seconds is suspect and
# is not traded on; a move of more than max_move since the bar before is
# reported. These are the defaults, and the whole section may be left out.
bars:
  interval_seconds: 86400
  twap_window_seconds: 1800
  max_twap_deviation: "0.02"
  max_move: "0.5"

# Execution. A rebalance leaves out a transfer worth less than min_trade_value
# (in the quote token). max_slippage is how far below the bar's close price,
# after the pools' fees, a swap's output may fall before the swap is refused.
# A modelled or quoted fill is taken delay_blocks after the first block of the
# bar's boundary. model is the offline fill model's own: what it takes off the
# close price on top of the fees, and the gas it charges per pool crossed, at
# the bar's base fee. quote is the quoted fill's own: the gas it adds, once
# per swap, to the quoter's estimate, which covers the pools' swaps alone.
# These are the defaults, and the whole section may be left out.
execution:
  min_trade_value: "10"
  max_slippage: "0.005"
  delay_blocks: 25
  model:
    slippage: "0.0005"
    gas_units_per_hop: 150000
  quote:
    gas_overhead_units: 50000

# A fork run signs as one of anvil's ten public dev accounts (0-9) and gives each
# swap deadline_seconds after the fork's clock to be mined. Left out, a fork run
# signs as account 0 with a 300-second deadline. Adding the section changes the
# config's snapshot, so a run started without it cannot be carried on with it:
# add it to a config of its own for fork runs, not to the one a paper run uses.
# fork:
#   account: 0
#   deadline_seconds: 300

# The name of the environment variable that holds the node's URL, never the
# URL itself. Backfilling and quoted backtests need an archive node, and so
# does a paper run that has to catch up on bars whose visits were missed.
rpc:
  url_env: ETH_RPC_URL

# Verdicts: what an outside judge said of each traded token at each bar, read
# from the store's verdicts table by source and carried in the strategy's view.
# Left out, the run reads none and its view carries none. Adding the section
# changes the config's snapshot, so a run started without it cannot be carried
# on with it. The verdict command writes under this source, so a config that
# both asks and reads names it once.
# verdicts:
#   source: tradingagents-rating-v1

# The judge the verdict command asks: the TradingAgents graph, over this LLM
# provider and these models (the provider's API key comes from the environment
# variable the engine names for it, OPENROUTER_API_KEY here, never from this
# file), with these analysts before its debate (any of market, social and
# news; the engine's fundamentals analyst reads a company's statements and is
# refused for a crypto asset), every completion capped at max_tokens, and
# asked about a bar only within ask_within_seconds of its boundary: the judge
# reads news and prices through the moment it is asked, so a later question
# would see hours past the fill the run trades at, and the bar is left unrated
# instead (a fake rating is not bound by it). These are the defaults, the
# Hyperliquid paper run's judge, so that the two scorecards compare; the
# whole section may be left out. It is not part of the config's snapshot: the
# verdicts a run reads name the model that gave each one. Only the verdict
# command reads it.
agent:
  llm_provider: openrouter
  deep_think_llm: "anthropic/claude-sonnet-4-6"
  quick_think_llm: "deepseek/deepseek-chat"
  selected_analysts: [market, social, news]
  max_tokens: 8192
  ask_within_seconds: 14400

# fixed_weights is a placeholder that drives the engine: hold these shares of
# portfolio value, and rebalance when one is more than `band` (absolute
# weight) away from its target. Numbers are quoted so no float digits are lost.
strategy:
  name: fixed_weights
  params:
    weights:
      USDC: "0.5"
      WETH: "0.3"
      WBTC: "0.2"
    band: "0.05"

# trend_vol_weights is a rule strategy: hold a token while its close is above
# its moving average, sized to a volatility target. Every param is required;
# the rule and the params are defined in strategies/trend_vol_weights.py.
# To use it, replace the strategy block above with this one (a file with two
# strategy keys is refused).
#
# strategy:
#   name: trend_vol_weights
#   params:
#     trend_window: 50
#     vol_window: 20
#     bars_per_year: 365
#     target_vol: "0.40"
#     max_weight: "0.5"
#     band: "0.05"

# ai_gated_weights holds trend_vol_weights' weights (its `rule`, every param of
# it; copy the control run's trend_vol_weights params verbatim, or the two runs
# do not compare) cut by what an outside judge said of each token at the bar:
# the view's verdicts, read by the verdicts section above, which this strategy
# needs (uncomment it, or the run fails on its first bar). A token with a
# verdict is held at the rule's weight times its rating's multiplier; one with
# no verdict at the bar, or a REVIEW one, takes no new
# risk, held at its present share capped at the rule's weight; one out of
# trend is at zero whatever was said. Every param is required; the policy is
# defined in strategies/ai_gated_weights.py. Multipliers are in [0, 1] and do
# not rise from Buy to Sell.
#
# strategy:
#   name: ai_gated_weights
#   params:
#     rule:
#       trend_window: 50
#       vol_window: 20
#       bars_per_year: 365
#       target_vol: "0.40"
#       max_weight: "0.5"
#       band: "0.05"
#     multipliers:
#       Buy: "1"
#       Overweight: "0.75"
#       Hold: "0.5"
#       Underweight: "0.25"
#       Sell: "0"
