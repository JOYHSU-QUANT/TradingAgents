[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagents"
version = "0.4.0"
description = "TradingAgents: Multi-Agents LLM Financial Trading Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3.81",
    "backtrader>=1.9.78.123",
    "langchain-anthropic>=1.3.2",  # method="json_schema" as GA output_config.format (#338)
    "langchain-experimental>=0.3.4",
    "langchain-google-genai>=4.0.0",
    "langchain-openai>=0.3.23",
    "langgraph>=0.4.8",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pandas>=2.3.0",
    "parsel>=1.10.0",
    "python-dotenv>=1.0.0",
    "pytz>=2025.2",
    "questionary>=2.1.0",
    "redis>=6.2.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "setuptools>=80.9.0",
    "stockstats>=0.6.5",
    "tqdm>=4.67.1",
    "typing-extensions>=4.14.0",
    "yfinance>=1.4.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15",
    "pytest>=8.0",
    "pytest-subtests>=0.13",
    "mypy>=2.0",
    # The Bedrock stop-reason row is pinned through the real langchain-aws
    # converter (tests/test_bedrock_provider.py); the extra rides here so CI
    # and a dev install run it instead of skipping it (#214).
    "langchain-aws>=1.5.0",
]
# Amazon Bedrock support (AWS SigV4 auth + boto3). Optional so the core install
# stays lean: pip install "tradingagents[bedrock]".
bedrock = [
    "langchain-aws>=1.5.0",
]

[project.scripts]
tradingagents = "cli.main:app"

[tool.setuptools.packages.find]
include = ["tradingagents*", "cli*"]

[tool.setuptools.package-data]
cli = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
    "smoke: quick sanity-check tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
# Refactor plan v2, T0: the perp module's lower layers only (pure types, no
# SDK); T1 added ``runtime/``, the kernel both lanes share. What they import
# is checked silently. The 15 errors these layers had
# on 2026-09-22 are pinned where they sit with ``# type: ignore[code]``, and
# ``warn_unused_ignores`` fails the job once one is fixed, so a pin can only
# be removed. ``contrib/replay`` (the offline scorecard, replay plan PR 1)
# joined clean on 2026-09-23 with no pins; its tests are excluded because
# the CI job installs mypy alone and the suites import pytest.
# ``contrib/uniswap_v3``'s pure layers (``domain/`` and ``ports.py``) joined
# clean on 2026-10-04; they import the standard library and each other only.
# ``contrib/carry`` (the carry coordinator, carry plan PR 1) joined clean on
# 2026-10-07; its tests are excluded for the same reason as replay's.
# ``contrib/core`` (the shared floor, dashboard plan PR 1) holds modules that
# were checked here as part of ``common`` before they moved; its tests are
# excluded for the same reason.
# ``contrib/dashboard`` (the status exporter, dashboard plan PR 3) joined clean
# on 2026-10-14; its tests are excluded for the same reason.
# The fork's own data-source modules under ``tradingagents/dataflows`` (the
# nine vendors, ``fear_greed`` and ``throttle``) and ``interface.py``, the
# upstream router the fork rebuilt, joined on 2026-10-19 (dataflows refactor
# plan, D0) with their 50 errors pinned where they sit, as the perp layers'
# were (one line in ``cftc_cot`` already carried a pin); the two in
# ``interface.py`` the plan lists as behaviour candidates (§5) are pinned,
# not fixed, here. ``vendor_common`` (the kernel D1-a moved out of
# ``sosovalue_common``) joined with no pins on 2026-10-19, as did ``dates``,
# ``failures``, ``lag_notes`` and ``untrusted`` (D4) on 2026-10-21.
# ``tests/test_dataflows_shape.py`` scopes its shape ratchets to the same
# modules and holds the two lists equal.
files = [
    "contrib/core",
    "contrib/hyperliquid_perp/common",
    "contrib/hyperliquid_perp/domains",
    "contrib/hyperliquid_perp/persistence",
    "contrib/hyperliquid_perp/ports.py",
    "contrib/hyperliquid_perp/runtime",
    "contrib/carry",
    "contrib/dashboard",
    "contrib/replay",
    "contrib/uniswap_v3/domain",
    "contrib/uniswap_v3/ports.py",
    "tradingagents/dataflows/cftc_cot.py",
    "tradingagents/dataflows/cme_basis.py",
    "tradingagents/dataflows/dates.py",
    "tradingagents/dataflows/deribit.py",
    "tradingagents/dataflows/failures.py",
    "tradingagents/dataflows/farside.py",
    "tradingagents/dataflows/fear_greed.py",
    "tradingagents/dataflows/hyperliquid_whales.py",
    "tradingagents/dataflows/interface.py",
    "tradingagents/dataflows/lag_notes.py",
    "tradingagents/dataflows/sosovalue.py",
    "tradingagents/dataflows/sosovalue_common.py",
    "tradingagents/dataflows/sosovalue_macro.py",
    "tradingagents/dataflows/sosovalue_treasuries.py",
    "tradingagents/dataflows/throttle.py",
    "tradingagents/dataflows/untrusted.py",
    "tradingagents/dataflows/vendor_common.py",
]
exclude = [
    "^contrib/carry/tests/",
    "^contrib/core/tests/",
    "^contrib/dashboard/tests/",
    "^contrib/replay/tests/",
]
python_version = "3.10"
follow_imports = "silent"
warn_unused_ignores = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "stockstats", "stockstats.*"]
ignore_missing_imports = true

# The replay package reads its variant files with PyYAML and, inside
# ``upstream.load_engine``, borrows langchain_core's message types (replay
# plan PR 2). The CI job installs mypy alone, so neither is found there;
# both are read as ``Any``, as pandas is. (mypy checks a function-local
# import too, so the lazy borrow needs the override as much as a top-level
# one would.)
[[tool.mypy.overrides]]
module = ["yaml", "yaml.*", "langchain_core", "langchain_core.*"]
ignore_missing_imports = true

# The dashboard's page (``contrib/dashboard/app``, dashboard plan PR 4) is
# built on FastAPI, Starlette and Jinja, pinned in the package's own
# requirements.txt and installed on the dashboard account's venv only. The
# CI job installs mypy alone, so they are read as ``Any`` there; with them
# installed (a dev machine) their own types are checked.
[[tool.mypy.overrides]]
module = ["fastapi", "fastapi.*", "starlette", "starlette.*", "jinja2", "jinja2.*", "uvicorn", "uvicorn.*"]
ignore_missing_imports = true

# The dataflows fetch with requests, read Farside's HTML with parsel and CME
# futures with yfinance. ``follow_imports = "skip"`` reads all three as ``Any``
# whether or not they are installed, so the CI job (mypy alone) and a dev
# venv (which has them, two of them typed) reach the same verdict by
# construction; the cost is that requests' and parsel's own types go
# unchecked here, which this floor accepts as it does pandas'.
[[tool.mypy.overrides]]
module = ["requests", "requests.*", "parsel", "parsel.*", "yfinance", "yfinance.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["results"]

[tool.ruff.lint]
# Standard "good defaults" rule set (pyflakes + pycodestyle + isort + bugbear +
# pyupgrade + comprehensions/simplify). Line length (E501) and layout are owned
# by the formatter; whole-repo `ruff format` adoption is deferred until the
# open-PR backlog clears, to avoid mass merge conflicts.
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]   # intentional re-exports

[tool.ruff.lint.isort]
# Keep multiple aliased names from one module in a single combined import block
# (e.g. the vendor re-exports in interface.py) instead of one statement per name.
combine-as-imports = true
